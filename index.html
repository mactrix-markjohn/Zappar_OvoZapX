<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Zap-X</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <script type="text/javascript" src="https://libs.zappar.com/zappar-cv/2.1.4/zappar-cv.js"></script>
    <style>
        html {
            box-sizing: border-box;
        }
        *, *:before, *:after {
            box-sizing: inherit;
        }
        html, body {
            height: 100%;
        }
        canvas {
            display: block;
        }
        body {
            margin: 0;
        }
        #unity-container {
            width: 100%;
            height: 100%;
        }
        #unity-canvas {
            width: 100%;
            height: 100%;
            background: #231F20;
        }
        #loading-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #unity-loading-bar {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #unity-progress-bar-empty {
            width: 80%;
            height: 24px;
            margin: 10px 20px 20px 10px;
            text-align: left;
            border: 1px solid white;
            padding: 2px;
        }
        #unity-progress-bar-full {
            width: 0%;
            height: 100%;
            background: white;
        }
        .light #unity-progress-bar-empty {
            border-color: black;
        }
        .light #unity-progress-bar-full {
            background: black;
        }

        .spinner,
        .spinner:after {
        border-radius: 50%;
        width: 5em;
        height: 5em;
        }
        .spinner {
        margin: 10px;
        font-size: 10px;
        position: relative;
        text-indent: -9999em;
        border-top: 1.1em solid rgba(255, 255, 255, 0.2);
        border-right: 1.1em solid rgba(255, 255, 255, 0.2);
        border-bottom: 1.1em solid rgba(255, 255, 255, 0.2);
        border-left: 1.1em solid #ffffff;
        transform: translateZ(0);
        animation: spinner-spin 1.1s infinite linear;
        }
        @keyframes spinner-spin {
        0% {
            transform: rotate(0deg);
        }
        100% {
            transform: rotate(360deg);
        }
        }



    </style>
  </head>
  <body class="dark">
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas"></canvas>
    </div>
    <div id="loading-cover" style="display:none;">
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty" style="display: none;">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div class="spinner"></div>
      </div>
    </div>
    <script>
      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/ZapXOVOZappar.loader.js";
      const config = {
        dataUrl: buildUrl + "/ZapXOVOZappar.data.unityweb",
        frameworkUrl: buildUrl + "/ZapXOVOZappar.framework.js.unityweb",
        codeUrl: buildUrl + "/ZapXOVOZappar.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Ovo",
        productName: "Zap-X",
        productVersion: "3.0.0",
      };

      const container = document.querySelector("#unity-container");
      const canvas = document.querySelector("#unity-canvas");
      const loadingCover = document.querySelector("#loading-cover");
      const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const spinner = document.querySelector('.spinner');

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        config.devicePixelRatio = 1;
      }
      loadingCover.style.display = "";

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          spinner.style.display = "none";
          progressBarEmpty.style.display = "";
          progressBarFull.style.width = `${100 * progress}%`;
        }).then((unityInstance) => {
          loadingCover.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
    <script>
      // Screen Wake Lock and WebRTC Camera Auto-Resume Script for Safari iOS
      (function() {
          const createdVideos = [];
          const originalCreateElement = document.createElement;
          document.createElement = function(tagName, options) {
              const element = originalCreateElement.call(document, tagName, options);
              if (tagName && tagName.toLowerCase() === 'video') {
                  createdVideos.push(element);
                  console.log("[Auto-Resume]: Intercepted dynamic video creation.");
              }
              return element;
          };

          let wakeLock = null;
          async function requestWakeLock() {
              if ('wakeLock' in navigator) {
                  try {
                      wakeLock = await navigator.wakeLock.request('screen');
                      console.log('Wake Lock acquired successfully.');
                  } catch (err) {
                      console.warn('Wake Lock request failed: ', err.message);
                  }
              }
          }

          function getVideos() {
              const domVideos = Array.from(document.getElementsByTagName('video'));
              const allVideos = domVideos.concat(createdVideos);
              return Array.from(new Set(allVideos));
          }

          function resumeVideoElement(video) {
              const stream = video.srcObject;
              if (stream) {
                  console.log("[Auto-Resume]: Re-attaching srcObject to recover camera video stream...");
                  video.srcObject = null;
                  video.srcObject = stream;
                  video.play().then(() => {
                      console.log("[Auto-Resume]: Camera video element resumed successfully.");
                  }).catch(err => {
                      console.error("[Auto-Resume]: Failed to play camera video: ", err);
                  });
              } else {
                  video.play().catch(err => console.log("[Auto-Resume]: Video play call: ", err));
              }
          }

          function handleVisibilityOrShow() {
              if (document.visibilityState === 'visible') {
                  requestWakeLock();
                  setTimeout(() => {
                      const videos = getVideos();
                      for (let i = 0; i < videos.length; i++) {
                          const video = videos[i];
                          if (video) {
                              resumeVideoElement(video);
                          }
                      }
                  }, 300);
              } else {
                  if (wakeLock !== null) {
                      wakeLock = null;
                  }
              }
          }

          if (document.readyState === 'complete' || document.readyState === 'interactive') {
              requestWakeLock();
          } else {
              document.addEventListener('DOMContentLoaded', requestWakeLock);
          }

          document.addEventListener('visibilitychange', handleVisibilityOrShow);
          window.addEventListener('pageshow', handleVisibilityOrShow);

          // Periodic video freeze detector
          let lastVideoTimes = new Map();
          let freezeCounters = new Map();
          let recoveryCooldowns = new Map();

          setInterval(() => {
              const videos = getVideos();
              for (let i = 0; i < videos.length; i++) {
                  const video = videos[i];
                  if (!video || video.paused) {
                      continue;
                  }
                  
                  const lastTime = lastVideoTimes.get(video) || 0;
                  const currentTime = video.currentTime;
                  
                  if (currentTime === lastTime && currentTime > 0) {
                      let count = (freezeCounters.get(video) || 0) + 1;
                      freezeCounters.set(video, count);
                      
                      if (count >= 2) { // Frozen for ~1 second (2 checks of 500ms)
                          const now = Date.now();
                          const lastRecovery = recoveryCooldowns.get(video) || 0;
                          if (now - lastRecovery > 5000) { // 5s cooldown between recoveries
                              recoveryCooldowns.set(video, now);
                              console.warn("[Auto-Resume]: Video element freeze detected. Attempting recovery...");
                              freezeCounters.set(video, 0);
                              resumeVideoElement(video);
                          }
                      }
                  } else {
                      freezeCounters.set(video, 0);
                  }
                  lastVideoTimes.set(video, currentTime);
              }
          }, 500);
      })();
    </script>
  </body>
</html>
